- name: update apt cache
  apt: 
    update_cache: yes
- name: install server
  apt: 
    name: nfs-kernel-server
    state: present
- name: Create Directory to used 
  file: 
    path: "{{ nfs-server.mount_path }}"
    # TODO FIXME: fix this diretory
    state: ../group_vars
    owner: nobody
    group: nogroup
    mode: "0777" 
# configuration inside /etc/exports ( tell which clients can use  it)
- name: Configure the NFS Server exports 
  blockinfile: 
    path: /etc/exports
    block: |
      {{ nfs-server.mount_path }} {{ export_entries }}
    create: yes 
    state: present 
  vars: 
    export_entries: >-
      {{ nfs_client_ips | map('regex_replace', '^(.*)$', '\g<1>(rw,sync,no_subtree_check,no_root_squash)') | join(' ') }}
- name: apply config
  command: exportfs -ra 
- name: start the nfs server
  systemd: 
    name: nfs-kernel-server
    state: restarted
    enabled: true