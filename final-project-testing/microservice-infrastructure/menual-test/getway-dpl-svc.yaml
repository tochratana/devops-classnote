apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: micro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tochratana/spring-micro-api-gateway:v1.0.0
          ports:
            - containerPort: 8282
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: micro-demo
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8282
      targetPort: 8282
  type: NodePort