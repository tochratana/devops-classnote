apiVersion: v1
kind: Pod
metadata:
  name: postgres-test
spec:
  containers:
    - name: postgres
      image: postgres:latest
      env:
        - name: POSTGRES_PASSWORD
          value: password
      volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      ports:
        containerPort: 5432

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: postgres-test-pvc