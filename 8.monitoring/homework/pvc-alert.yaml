apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pvc-usage-alertrule
  labels:
    release: labels
  groups:
    - name: pvc.rules
      rules:
        - alert: PVCStorageAlmostFull
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
          for: 1m
          labels:
            severity: critical
            alertname: PVCStorageAlmostFull
          annotations:
            summary: "PVC storage usage is high"
            description: "PVC storage usage in namespace default is above 80%"