- name: Install Common Service Playbook
  hosts: all
  become: yes
  tasks:
    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present3

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Install Docker Compose
      apt:
        name: docker-compose
        state: present

    - name: Install fish shell
      apt:
        name: fish
        state: present

    - name: Install Neofetch
      apt:
        name: neofetch
        state: present

    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Add user into docker group
      user:
        name: tochratana
        groups: docker
        append: true



