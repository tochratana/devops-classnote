- import_tasks: install-docker-task.yaml

- name: Create app directory
  file:
    path: "{{ spring_app.app_dir }}"
    state: directory

- name: Copy docker-compose file
  copy:
    src: docker-compose.yml
    dest: "{{ spring_app.app_dir }}/docker-compose.yml"

- name: Pull Spring image
  command: docker compose pull
  args:
    chdir: "{{ spring_app.app_dir }}"

- name: Run Spring app
  command: docker compose up -d
  args:
    chdir: "{{ spring_app.app_dir }}"
