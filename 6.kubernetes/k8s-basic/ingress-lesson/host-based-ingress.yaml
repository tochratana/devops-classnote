apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-staging"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingressClassName: "nginx"
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: "nginx"
  tls: 
    - hosts: 
      - k8s-nginx-demo.tochratana.com
     # - reactjs-k8s.anajak-khmer.site
      secretName: nginx-k8s-tls
  rules:
  - host: k8s-nginx-demo.tochratana.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: nginx-svc
            port: 
              number: 80